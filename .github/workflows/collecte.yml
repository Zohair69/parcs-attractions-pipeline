name: Collecte horaire des temps d'attente

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures, à la minute 7 (heure UTC)
  workflow_dispatch:      # permet aussi de lancer la collecte à la main

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les librairies nécessaires
        run: pip install requests pandas google-cloud-bigquery

      - name: Lancer la collecte des temps d'attente
        run: python src/collecte.py
        env:
          GCP_CLE_JSON: ${{ secrets.GCP_CLE_JSON }}

      - name: Lancer la collecte météo
        if: always()   # même si la collecte des temps d'attente échoue
        run: python src/meteo.py
        env:
          GCP_CLE_JSON: ${{ secrets.GCP_CLE_JSON }}